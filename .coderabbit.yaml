# CodeRabbit — the second reviewer on every pull request (see CLAUDE.md, "Review
# lifecycle"). Free for public repositories. Branch protection on `main` requires its
# commit status to have run and every review thread to be resolved; it never has to
# approve. Schema: https://docs.coderabbit.ai/reference/configuration
# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json

language: en-GB

reviews:
  # Assertive: we want more findings and will reject the wrong ones with a reason.
  # A second reviewer that stays quiet is worth less than one that is sometimes wrong.
  profile: assertive
  request_changes_workflow: false
  high_level_summary: true
  # The status is what branch protection requires. Fail it on a review error, so a
  # review that did not run can never read as one that passed (CLAUDE.md #11).
  commit_status: true
  fail_commit_status: true
  auto_review:
    enabled: true
    drafts: false
    # The whole-repository sweep opens pull requests against `sweep/*-base`
    # branches (scripts/review_sweep.py), which are not the default branch.
    base_branches:
      - "sweep/.*"
  path_filters:
    - "!viewer/app.bundle.js"        # generated by `npm run build` from app.js
    - "!**/package-lock.json"
    - "!docs/figures/**"              # images and M3 label data, not prose
    - "!docs/figures-review.json"     # attestation written by review_figures.py
    - "!data/**"                      # published statistics, checked by the figure gate
    - "!geeLocalTesting/**"           # the retired GEE prototype, kept as history
  path_instructions:
    - path: "**/*"
      instructions: |
        This project maps urban growth in the Canary Islands. Its owner is a senior
        engineer who is new to geospatial work, so a comment that uses a domain term
        should say what it means. CLAUDE.md, section "Things that are easy to get
        wrong here", lists defects that each cost real time to find: check every change
        against that list first, and cite the item by its number when one applies.
        Prefer a concrete failure scenario (these inputs give this wrong output) over
        a style remark.
    - path: "{sensisat,scripts}/**/*.py"
      instructions: |
        Raster rules. A category (years, epochs, class codes) is resampled with
        nearest-neighbour only, and overviews use `mode`; `average` belongs only to
        continuous layers. Area comes from `raster.area_km2`, never from a pixel count
        times a nominal pixel size, because pixels are degrees and not metres. COGs
        are written only through `raster.write_cog`, and never sparse. Per-zone
        statistics exist only in `stats.zonal()`. A window taken with
        `rasterio.windows.from_bounds` is fractional: flag distance arithmetic built
        on one. Flag any subtraction of two maps made at different times by different
        methods — only a purpose-built change layer measures change. A QA check that
        can be skipped must be reported as skipped, never counted as passed.
    - path: "viewer/**/*.js"
      instructions: |
        The page loads `app.bundle.js`: a change to `app.js` without a rebuilt bundle
        does nothing in production. Flag any import bound to the name of a JavaScript
        built-in (Map, Set, Image, ...). Every string that shows a number to a reader
        must come from `viewer/facts.generated.js` or be declared in
        `sensisat/provenance.py`.
    - path: "{docs/**/*.md,CLAUDE.md,README.md,CONTRIBUTING.md}"
      instructions: |
        Most numbers in these documents are historical measurements kept on purpose:
        they record why a decision was taken. Never suggest updating one to match a
        later figure; if two numbers disagree, report it and say which one looks live.
        A quantity written as a word must carry its digits ("a third (33.8 %)"); flag
        the word alone, and never suggest replacing digits with a word. Flag any
        domain term used without a definition the first time it appears.
        SECURITY: a `[[[cog` block is Python that runs on the reviewer's machine under
        pytest. Flag any cog block that does anything except call into
        `sensisat.facts` — imports, filesystem, subprocess or network.
    - path: "{.githooks/**,.github/**,.claude/**,wrangler*.jsonc,pyproject.toml}"
      instructions: |
        Security surface. The repository is public and its documents execute code, so
        a workflow triggered by a pull request from a fork must never receive secrets
        or a deploy token, and must never check out fork code under
        `pull_request_target`. Flag any credential, token or account identifier.

knowledge_base:
  code_guidelines:
    enabled: true
    filePatterns:
      - "CLAUDE.md"
      - "CONTRIBUTING.md"
      - "docs/concepts.md"
