[project]
name = "sensisat"
version = "0.1.0"
description = "Urban expansion in the Canary Islands from open satellite and cadastral datasets"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

# Milestones 0-2: local data evaluation, then the local processing pipeline.
# Serving dependencies (titiler, uvicorn, ...) are not needed until M4 — M2's
# output is a folder of static files, and nothing serves them yet.
dependencies = [
    "numpy>=1.26",
    "pandas>=2.0",
    "requests>=2.31",
    "rasterio>=1.3",
    "shapely>=2.0",
    "geopandas>=1.0",
    "pyogrio>=0.7",         # fast vector I/O backend for geopandas
    "scipy>=1.11",          # morphology helpers for change maps / flicker filtering
    "matplotlib>=3.8",
    "pillow>=10.0",
    "pyproj>=3.6",          # municipality extents come in UTM and must reach lon/lat
    "pystac>=1.10",         # M2: the STAC catalogue
    "rio-cogeo>=5.0",       # M2: valid COG writing, not just GeoTIFF + overviews
]

[project.optional-dependencies]
# WSF Tracker ships as GeoZarr (Zarr v3) on an S3-compatible endpoint.
zarr = ["xarray>=2024.1", "zarr>=3.0", "fsspec>=2024.1", "s3fs>=2024.1", "aiohttp>=3.9"]
# fastapi is a TEST dependency, not a runtime one. Decision 7 says the per-zone
# statistics must have exactly one implementation, shared by the batch build and by
# a future web API. tests/test_api_parity.py stands up a throwaway route to prove
# the two callers return byte-identical JSON; nothing in sensisat/ imports fastapi.
dev = [
    "pytest>=8.0", "ruff>=0.5", "jupyterlab>=4.0", "nbformat>=5.9",
    "fastapi>=0.110", "httpx>=0.27", "stac-validator>=3.3",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["sensisat*"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]  # long lines are tolerated in data tables and URLs

[tool.pytest.ini_options]
testpaths = ["tests"]
